name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node -e "import('./dist/index.js').then(m=>{if(m.PLUGIN_PROTOCOL!=='wagonbox.plugin.v1')process.exit(1); console.log('protocol ok')})"